<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720">
  <!-- Логотип Maextro по картинке пользователя (08.10.2026): вытянутый кристалл с решёткой и плашка с названием -->
  <g fill="none" stroke="#111" stroke-width="5" stroke-linejoin="miter">
    <!-- верхняя половина решётки -->
    <line x1="180" y1="28" x2="180" y2="318"/>
    <line x1="52" y1="152" x2="308" y2="152"/>
    <line x1="180" y1="28" x2="88" y2="318"/>
    <line x1="180" y1="28" x2="272" y2="318"/>
    <line x1="52" y1="152" x2="180" y2="318"/>
    <line x1="308" y1="152" x2="180" y2="318"/>
    <line x1="52" y1="152" x2="140" y2="318"/>
    <line x1="308" y1="152" x2="220" y2="318"/>
    <line x1="52" y1="230" x2="308" y2="230"/>
    <!-- нижняя половина (зеркально) -->
    <line x1="180" y1="402" x2="180" y2="692"/>
    <line x1="52" y1="568" x2="308" y2="568"/>
    <line x1="180" y1="692" x2="88" y2="402"/>
    <line x1="180" y1="692" x2="272" y2="402"/>
    <line x1="52" y1="568" x2="180" y2="402"/>
    <line x1="308" y1="568" x2="180" y2="402"/>
    <line x1="52" y1="568" x2="140" y2="402"/>
    <line x1="308" y1="568" x2="220" y2="402"/>
    <line x1="52" y1="490" x2="308" y2="490"/>
  </g>
  <!-- контур кристалла -->
  <polygon points="180,22 314,148 314,572 180,698 46,572 46,148" fill="none" stroke="#111" stroke-width="16" stroke-linejoin="miter"/>
  <!-- плашка с названием -->
  <rect x="58" y="314" width="244" height="92" fill="#111"/>
  <rect x="68" y="324" width="224" height="72" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="180" y="375" text-anchor="middle" font-family="Times New Roman, Liberation Serif, DejaVu Serif, serif" font-size="44" letter-spacing="1" fill="#fff">MAEXTRO</text>
</svg>
