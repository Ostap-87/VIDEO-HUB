<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
html,body{margin:0;overflow:hidden;background:transparent}
#st{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:radial-gradient(70% 60% at 50% 46%,#1a4fb0 0%,#0b2a6b 40%,#06132f 74%,#040b1e 100%)}
#floor{position:absolute;left:50%;top:calc(var(--cy) + var(--s)*0.25);width:calc(var(--s)*0.95);height:calc(var(--s)*0.22);translate:-50% 0;border-radius:50%;
 background:radial-gradient(closest-side,rgba(90,170,255,.75),rgba(40,120,255,.25) 55%,rgba(40,120,255,0));filter:blur(calc(var(--s)*0.02))}
canvas{position:absolute;left:0;top:0;filter:drop-shadow(0 0 calc(var(--s)*0.03) rgba(80,160,255,.9)) drop-shadow(0 0 calc(var(--s)*0.09) rgba(26,115,232,.75))}
#ring{position:absolute;left:0;top:0;width:100%;height:100%}
</style>
<script type="importmap">{"imports":{"three":"/reels-studio/node_modules/three/build/three.module.js","three/addons/":"/reels-studio/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="st"><div id="floor"></div><svg id="ring"></svg></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1080, S = Math.min(W, H) * (+q.get('k') || 1), CY = +q.get('cy') || H / 2;
const st = document.getElementById('st'); st.style.setProperty('--w', W + 'px'); st.style.setProperty('--h', H + 'px');
st.style.setProperty('--s', S + 'px'); st.style.setProperty('--cy', CY + 'px');
// кольцо с надписью (как у нынешнего аватара)
if (q.get('ring')) {
  const R = S * 0.43, cx = W / 2, cy = CY, txt = 'GLOBAL TECH TOUR · 全球科技之旅 · ';
  document.getElementById('ring').innerHTML = `<defs><path id="rp" d="M${cx - R} ${cy} a${R} ${R} 0 1 1 ${2 * R} 0 a${R} ${R} 0 1 1 ${-2 * R} 0"/></defs>
   <circle cx="${cx}" cy="${cy}" r="${R + S * 0.045}" fill="none" stroke="rgba(140,190,255,.45)" stroke-width="${S * 0.004}"/>
   <text font-family="Golos" font-weight="700" font-size="${S * 0.043}" fill="rgba(205,225,255,.9)"><textPath href="#rp" startOffset="0" textLength="${2 * Math.PI * R - S * 0.01}" lengthAdjust="spacing">${txt.repeat(2)}</textPath></text>`;
}
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
st.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer); 
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); cam.position.set(0, 0.25, 7.2);
// сдвиг центра кадра под cy
cam.setViewOffset(W, H, 0, (H / 2 - CY), W, H); cam.lookAt(0, 0, 0);
const scale = (S / H) * 1.0;
// кристалл: октаэдр, чуть вытянут, как на логотипе
const geo = new THREE.OctahedronGeometry(1, 0); geo.scale(1.18, 1.0, 0.9);
const mat = new THREE.MeshStandardMaterial({ color: 0x2a7bf0, emissive: 0x0b3a9e, emissiveIntensity: 0.55, metalness: 0.25, roughness: 0.18,
  flatShading: true, transparent: true, opacity: 0.72, side: THREE.DoubleSide, depthWrite: false });
const crystal = new THREE.Group(); scene.add(crystal);
const mesh = new THREE.Mesh(geo, mat); crystal.add(mesh);
const edges = new THREE.EdgesGeometry(geo);
const mkLines = (op, depth, lw) => { const lg = new LineSegmentsGeometry().setPositions(edges.attributes.position.array);
  const lm = new LineMaterial({ color: 0xe8f4ff, linewidth: lw, transparent: true, opacity: op, depthTest: depth }); lm.resolution.set(W, H);
  return new LineSegments2(lg, lm); };
crystal.add(mkLines(0.38, false, Math.max(1.5, S * 0.0022)));   // задние рёбра — как внутренние линии логотипа
crystal.add(mkLines(1.0, true, Math.max(2.5, S * 0.0048)));
// свет внутри кристалла
const gl = document.createElement('canvas'); gl.width = gl.height = 128; const gg = gl.getContext('2d');
const g2 = gg.createRadialGradient(64, 64, 0, 64, 64, 64); g2.addColorStop(0, 'rgba(255,255,255,1)'); g2.addColorStop(.18, 'rgba(170,215,255,.85)'); g2.addColorStop(.5, 'rgba(60,140,255,.35)'); g2.addColorStop(1, 'rgba(26,115,232,0)');
gg.fillStyle = g2; gg.fillRect(0, 0, 128, 128);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(gl), blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, transparent: true }));
glow.scale.setScalar(1.25); glow.material.opacity = 0.8; crystal.add(glow);
const core = new THREE.Mesh(new THREE.SphereGeometry(0.07, 24, 24), new THREE.MeshBasicMaterial({ color: 0xffffff })); crystal.add(core);
crystal.scale.setScalar(scale * 0.95);
// свет: синий снизу, холодный контровой, мягкий сверху
const l1 = new THREE.PointLight(0x3d8bff, 90, 0, 2); l1.position.set(0, -2.2, 1.8); scene.add(l1);
const l2 = new THREE.DirectionalLight(0xdcebff, 3.2); l2.position.set(-3, 3, 4); scene.add(l2);
const l3 = new THREE.DirectionalLight(0x4f9bff, 3.0); l3.position.set(3.5, 1, -3); scene.add(l3);
scene.add(new THREE.AmbientLight(0x1a3a80, 0.6));
// искры вокруг
const N = 140, pos = new Float32Array(N * 3), rnd = (a) => { let x = Math.sin(a * 127.1) * 43758.5453; return x - Math.floor(x); };
for (let i = 0; i < N; i++) { const r = 1.5 + rnd(i) * 1.6, a = rnd(i + 9) * Math.PI * 2, y = (rnd(i + 21) - .5) * 2.6;
  pos.set([Math.cos(a) * r, y, Math.sin(a) * r * .6 - .4], i * 3); }
const spr = document.createElement('canvas'); spr.width = spr.height = 64; const g = spr.getContext('2d');
const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(160,210,255,.9)'); gr.addColorStop(1, 'rgba(60,140,255,0)');
g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
const pts = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pos, 3)),
  new THREE.PointsMaterial({ size: 0.07, map: new THREE.CanvasTexture(spr), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xa8d4ff }));
pts.scale.setScalar(scale * 1.1); scene.add(pts);
window.renderAt = (t) => { // t от 0 до 1 — один оборот
  crystal.rotation.set(0.32 + Math.sin(t * Math.PI * 2) * 0.06, t * Math.PI * 2 + 0.6, 0.18);
  crystal.position.y = Math.sin(t * Math.PI * 2) * 0.05 * scale;
  pts.rotation.y = t * Math.PI * 2;
  core.scale.setScalar(1 + 0.25 * Math.sin(t * Math.PI * 4)); glow.scale.setScalar(1.25 + 0.12 * Math.sin(t * Math.PI * 4));
  renderer.render(scene, cam); return true; };
window.renderAt(+q.get('t') || 0); window.ready = true;
</script></body></html>
