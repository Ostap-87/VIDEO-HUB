<style>

 background:radial-gradient(closest-side,rgba(90,170,255,.7),rgba(40,120,255,.22) 55%,rgba(40,120,255,0));filter:blur(calc(var(--s)*0.02))}
canvas{position:absolute;left:0;top:0;filter:drop-shadow(0 0 calc(var(--s)*0.025) rgba(80,160,255,.75)) drop-shadow(0 0 calc(var(--s)*0.08) rgba(26,115,232,.55))}

</head><body><div id="st"><div id="floor"></div></div>
<script type="module">
// «Дорогие» 3D-предметы хайлайтов GTT: стекло со студийными отражениями, хром, светящиеся детали, синий ореол
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
import { Font } from 'three/addons/loaders/FontLoader.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1080, S = Math.min(W, H) * (+q.get('k') || 1), CY = +q.get('cy') || H / 2, OBJ = q.get('obj') || 'plane';
const st = document.getElementById('st'); st.style.setProperty('--w', W + 'px'); st.style.setProperty('--h', H + 'px'); st.style.setProperty('--s', S + 'px'); st.style.setProperty('--cy', CY + 'px');
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W, H); R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; st.appendChild(R.domElement);
const scene = new THREE.Scene();
// студийное окружение: тёмно-синий купол + софтбоксы (отражения на стекле и хроме)
{ const env = new THREE.Scene(); const dome = new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true }));
  const c = []; const pos = dome.geometry.attributes.position; for (let i = 0; i < pos.count; i++) { const y = pos.getY(i) / 20; const t = (y + 1) / 2;
    const col = new THREE.Color(0x020814).lerp(new THREE.Color(0x0d3a8c), Math.pow(t, 1.6)); c.push(col.r, col.g, col.b); }
  dome.geometry.setAttribute('color', new THREE.Float32BufferAttribute(c, 3)); env.add(dome);
  const box = (w, h, x, y, z, col, I) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(I), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
  box(14, 4, 0, 16, 4, 0xdfeeff, 2.2); box(3, 12, -15, 3, 6, 0x7fc4ff, 1.8); box(3, 10, 15, 1, -4, 0x2f7bff, 2.0); box(10, 2, 0, -14, 8, 0x3d8bff, 1.4); box(4, 4, 6, 6, 15, 0xffffff, 1.5);
  scene.environment = new THREE.PMREMGenerator(R).fromScene(env, 0.02).texture; }
const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 100); cam.position.set(0, 0.35, 8.2); cam.setViewOffset(W, H, 0, (H / 2 - CY), W, H); cam.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0x9cc8ff, 0x061022, 0.5));
const key = new THREE.DirectionalLight(0xe8f2ff, 2.2); key.position.set(-3, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0x3d8bff, 3.5); rim.position.set(3, 1.5, -4); scene.add(rim);
const under = new THREE.PointLight(0x2f86ff, 40, 0, 2); under.position.set(0, -2.6, 1.5); scene.add(under);
// материалы
const GLASS = new THREE.MeshPhysicalMaterial({ color: 0x9fcbff, metalness: 0, roughness: 0.05, transmission: 0.62, thickness: 0.6, ior: 1.5, clearcoat: 1, clearcoatRoughness: 0.03,
  attenuationColor: new THREE.Color(0x3b7fe6), attenuationDistance: 2.2, envMapIntensity: 1.6, specularIntensity: 1, transparent: true });
const CHROME = new THREE.MeshPhysicalMaterial({ color: 0xd6e6ff, metalness: 1, roughness: 0.14, envMapIntensity: 1.5, clearcoat: 0.6 });
const DARK = new THREE.MeshPhysicalMaterial({ color: 0x0a1a3a, metalness: 0.6, roughness: 0.25, envMapIntensity: 1.2, clearcoat: 1 });
const GLOW = new THREE.MeshBasicMaterial({ color: 0xbfe2ff });
const RED = new THREE.MeshPhysicalMaterial({ color: 0xc8261f, metalness: 0.1, roughness: 0.35, clearcoat: 0.8, clearcoatRoughness: 0.2, envMapIntensity: 1.2 });
const root = new THREE.Group(); scene.add(root);
const add = (geo, mat, f = () => {}, parent = root) => { const m = new THREE.Mesh(geo, mat); f(m); parent.add(m); return m; };
// синий ореол по контуру стеклянных деталей
const halo = (m, k = 1.025, op = 0.28) => { const h = new THREE.Mesh(m.geometry, new THREE.MeshBasicMaterial({ color: 0x3d8bff, transparent: true, opacity: op, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  h.position.copy(m.position); h.rotation.copy(m.rotation); h.scale.copy(m.scale).multiplyScalar(k); m.parent.add(h); return h; };
const shape = (pts) => new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
const rrect = (w, h, r) => { const s = new THREE.Shape(); s.moveTo(-w/2 + r, -h/2); s.lineTo(w/2 - r, -h/2); s.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r); s.lineTo(w/2, h/2 - r);
  s.quadraticCurveTo(w/2, h/2, w/2 - r, h/2); s.lineTo(-w/2 + r, h/2); s.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r); s.lineTo(-w/2, -h/2 + r); s.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2); return s; };
const ext = (sh, depth, bev = 0.02, seg = 3) => { const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: bev > 0, bevelThickness: bev, bevelSize: bev, bevelSegments: seg, curveSegments: 24 }); g.center(); return g; };
let ready = Promise.resolve();

const B = {
  // Туры: пассажирский лайнер (нос +X, верх +Y, размах по Z)
  plane() { const P = new THREE.Group(); root.add(P);
    const prof = [[0, -1.62], [0.05, -1.58], [0.12, -1.45], [0.19, -1.22], [0.245, -0.88], [0.262, -0.45], [0.262, 0.62], [0.256, 0.96], [0.236, 1.18], [0.19, 1.36], [0.12, 1.5], [0.05, 1.585], [0, 1.6]];
    const FUS = new THREE.MeshPhysicalMaterial({ color: 0x8fc2ff, metalness: 0.15, roughness: 0.1, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.7, sheen: 0.4, sheenColor: new THREE.Color(0x9fd0ff) });
    const fus = add(new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 72), FUS, m => { m.rotation.z = -Math.PI / 2; }, P);
    for (const sd of [1, -1]) { for (let i = 0; i < 22; i++) add(new THREE.SphereGeometry(0.021, 10, 8), GLOW, m => { m.position.set(-0.95 + i * 0.088, 0.07, sd * 0.256); m.scale.set(1, 1.3, 0.35); }, P);
    }
    // лобовое стекло: секции на поверхности носа (лата фюзеляжа, углы вокруг оси — от бока через верх к другому боку)
    const rAt = (y) => { for (let i = 1; i < prof.length; i++) if (y <= prof[i][1]) { const [r0, y0] = prof[i - 1], [r1, y1] = prof[i]; return r0 + (r1 - r0) * (y - y0) / (y1 - y0); } return 0; };
    const WIN = new THREE.MeshPhysicalMaterial({ color: 0x06142e, metalness: 0.5, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 2.2 });
    for (const [a0, a1, y0, y1] of [[202, 238, 1.3, 1.45], [242, 268, 1.335, 1.475], [272, 298, 1.335, 1.475], [302, 338, 1.3, 1.45]]) { const pts = []; for (let k = 0; k <= 8; k++) { const y = y0 + k * (y1 - y0) / 8; pts.push(new THREE.Vector2(rAt(y) * 1.012 + 0.002, y)); }
      const pane = add(new THREE.LatheGeometry(pts, 14, a0 * Math.PI / 180, (a1 - a0) * Math.PI / 180), WIN, m => { m.rotation.z = -Math.PI / 2; }, P); pane.userData.noOutline = true; }
    const wingGeo = (pts, t, bev) => new THREE.ExtrudeGeometry(shape(pts), { depth: t, bevelEnabled: true, bevelThickness: bev, bevelSize: bev * 0.9, bevelSegments: 3, curveSegments: 12 });
    const WING = [[0.45, 0], [-0.33, 1.78], [-0.6, 1.78], [-0.52, 0]];
    for (const sd of [1, -1]) {
      const w = add(wingGeo(WING, 0.04, 0.022), GLASS, m => { m.rotation.x = sd * Math.PI / 2; m.position.set(0.1, -0.13, 0); m.rotateY(sd * 0.07); }, P); halo(w, 1.015, 0.18);

    }
    for (const sd of [1, -1]) add(wingGeo([[-1.08, 0], [-1.38, 0.64], [-1.53, 0.64], [-1.55, 0]], 0.026, 0.012), GLASS, m => { m.rotation.x = sd * Math.PI / 2; m.position.set(0, 0.07, 0); m.rotateY(sd * 0.05); }, P);
    const fin = add(wingGeo([[-0.92, 0.17], [-1.42, 0.88], [-1.62, 0.88], [-1.6, 0.17]], 0.028, 0.012), GLASS, m => { m.position.z = -0.014; }, P); halo(fin, 1.02, 0.18);
    P.rotation.set(0.22, -0.55, 0.16); P.scale.setScalar(1.08); },
};
(B[OBJ] || B.plane)();
// неон: neon=1 — абрис по силуэту, 2 — + грани крыльев и оперения, 3 — «чистый неон» (корпус тёмное стекло); nc — цвет неона
const NEON = +(q.get('neon') || 0), NC = new THREE.Color('#' + (q.get('nc') || 'cfeeff'));
if (NEON) {
  const meshes = []; root.traverse(o => { if (o.isMesh && !o.userData.noOutline && o.material !== GLOW && !(o.material && o.material.blending === THREE.AdditiveBlending)) meshes.push(o); });
  const outline = (m, th) => { const g0 = new THREE.BufferGeometry(); g0.setAttribute('position', m.geometry.attributes.position.clone()); if (m.geometry.index) g0.setIndex(m.geometry.index.clone());
    const g = mergeVertices(g0, 1e-4); g.computeVertexNormals();
    const hull = (t, col) => { const mat = new THREE.MeshBasicMaterial({ color: col, side: THREE.BackSide });
      mat.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `vec3 transformed = position + normal * ${t.toFixed(4)};`); };
      const o = new THREE.Mesh(g, mat); o.position.copy(m.position); o.rotation.copy(m.rotation); o.scale.copy(m.scale); m.parent.add(o); };
    // неоновая трубка: широкое синее свечение снаружи, светлая сердцевина внутри
    hull(th * 2.3, new THREE.Color(0x2f86ff).lerp(new THREE.Color(0x0b2a6b), 0.25)); hull(th, NC); };
  const TH = +(q.get('th') || 0.02);
  meshes.forEach(m => outline(m, TH / Math.max(1e-3, Math.abs(m.scale.x))));
  if (NEON >= 2) meshes.filter(m => m.geometry.type === 'ExtrudeGeometry').forEach(m => { const e = new THREE.EdgesGeometry(m.geometry, 35);
    const mk = (lw, col, op) => { const lg = new LineSegmentsGeometry().setPositions(e.attributes.position.array); const lm = new LineMaterial({ color: col, linewidth: lw, transparent: true, opacity: op }); lm.resolution.set(W, H);
      const L = new LineSegments2(lg, lm); L.position.copy(m.position); L.rotation.copy(m.rotation); L.scale.copy(m.scale); m.parent.add(L); };
    mk(S * 0.007, new THREE.Color(0x2f86ff), 0.55); mk(S * 0.0026, NC, 1); });
  if (NEON === 3) meshes.forEach(m => { if (m.material !== DARK && !m.userData.noOutline) m.material = new THREE.MeshPhysicalMaterial({ color: 0x061736, metalness: 0.3, roughness: 0.06, clearcoat: 1, envMapIntensity: 0.9 }); });
  document.querySelector('canvas').style.filter = `drop-shadow(0 0 ${S*0.006}px rgba(255,255,255,.9)) drop-shadow(0 0 ${S*0.02}px #${NC.getHexString()}) drop-shadow(0 0 ${S*0.06}px rgba(26,115,232,.85))`;
}
root.scale.setScalar(S / H * 1.0);
window.renderAt = (t) => { root.rotation.y = Math.sin(t * Math.PI * 2) * 0.08; root.position.y = Math.sin(t * Math.PI * 2) * 0.04; R.render(scene, cam); return true; };
ready.then(() => { window.renderAt(+q.get('t') || 0); window.ready = true; });
</script></body></html>
