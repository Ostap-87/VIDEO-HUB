<!doctype html>
<meta charset="utf-8">
<!-- Подпись для почты GTT: имя по-английски, под ним строка о деле и логотип пользователя
     (source-videos/логотипы/общие/globaltechtour.png). Без фото (решения пользователя 13.10.2026). Рендер — render.sh. -->
<link rel="stylesheet" href="../шаблон/fonts/fonts.css">
<style>
  :root { --blue: #2563eb; --ink: #111827; --muted: #5b6472; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #fff; font-family: Inter, sans-serif; color: var(--ink); }
  .card { width: 380px; height: 140px; position: relative; background: #fff; padding: 20px 22px 0; }
  .card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--blue); }
  .name { font-weight: 700; font-size: 27px; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; }
  .role { font-weight: 500; font-size: 13.5px; color: var(--muted); margin-top: 6px; white-space: nowrap; }
  .logo { width: 262px; display: block; margin: 12px 0 0 -4px; }
</style>
<body>
<div class="card">
  <div class="name">Ostap Dotcenko</div>
  <div class="role">Основатель · бизнес-экспедиции в Китай</div>
  <img class="logo" src="../../source-videos/логотипы/общие/globaltechtour.png" alt="Global Tech Tour">
</div>
</body>
